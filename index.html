<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash or Crash - Master Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(180deg, #10b981 0%, #065f46 25%, #0f172a 60%, #020617 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-x: hidden;
        }
        .game-container {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid rgba(74, 222, 128, 0.35);
            backdrop-filter: blur(14px);
            border-radius: 24px;
            padding: 18px;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.85);
            text-align: center;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 2px;
            background: linear-gradient(45deg, #4ade80, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.4);
            padding: 6px 12px;
            border-radius: 10px;
        }
        .balance-panel span {
            color: #4ade80;
            font-weight: bold;
        }

        /* Tableau de bord des dernières cotes (Historique) */
        .history-board {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .history-tag {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .history-tag.high { color: #4ade80; border-color: rgba(74, 222, 128, 0.4); }
        .history-tag.low { color: #f87171; border-color: rgba(248, 113, 113, 0.4); }

        /* Puits en pierres grises texturées avec ombrages profonds */
        .well-container {
            position: relative;
            width: 100%;
            height: 220px;
            margin: 0 auto 12px auto;
            background: 
                radial-gradient(circle at center, #252f3e 0%, #090d14 100%),
                repeating-linear-gradient(0deg, transparent, transparent 15px, rgba(0,0,0,0.6) 15px, rgba(0,0,0,0.6) 19px),
                repeating-linear-gradient(90deg, transparent, transparent 30px, rgba(255,255,255,0.02) 30px, rgba(255,255,255,0.02) 33px);
            border: 4px solid #334155;
            border-top: 8px solid #475569;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: inset 0 25px 45px rgba(0,0,0,0.95), inset 0 0 20px rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
        }

        .well-container::before {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 25px 0 35px rgba(0,0,0,0.85), inset -25px 0 35px rgba(0,0,0,0.85);
            pointer-events: none;
            z-index: 2;
        }

        .bucket-assembly {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateY(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            transition: transform 0.08s ease-in-out;
        }

        .rope {
            width: 4px;
            background: #e2e8f0;
            box-shadow: 2px 0 4px rgba(0,0,0,0.9);
            height: 4px; 
            transition: height 0.08s ease-in-out;
        }

        .bucket {
            position: relative;
            width: 50px;
            height: 44px;
            background: linear-gradient(135deg, #64748b, #334155);
            border: 2px solid #cbd5e1;
            border-radius: 0 0 10px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.85), inset 0 3px 6px rgba(255,255,255,0.25);
        }
        
        .bucket::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 38px;
            height: 10px;
            border: 2px solid #e2e8f0;
            border-top: none;
            border-radius: 0 0 6px 6px;
        }

        .multiplier-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 12px;
        }

        .multiplier {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            font-size: 1.05rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        .btn-start {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        }
        .btn-cashout {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0f172a;
            box-shadow: 0 6px 20px rgba(234, 179, 8, 0.4);
            display: none;
        }
        .message {
            margin-top: 10px;
            font-size: 0.9rem;
            min-height: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Cash or Crash</h1>
        
        <div class="balance-panel">
            <div>Balance: $<span id="balance">100</span></div>
            <div>Bet: <b>$10</b></div>
        </div>

        <!-- Tableau de bord des dernières cotes -->
        <div class="history-board" id="historyBoard">
            <span class="history-tag">No history</span>
        </div>

        <!-- Puits et seau mécanique -->
        <div class="well-container" id="wellContainer">
            <div class="bucket-assembly" id="bucketAssembly" style="transform: translateX(-50%) translateY(8px);">
                <div class="rope" id="rope" style="height: 4px;"></div>
                <div class="bucket">🪣</div>
            </div>
        </div>

        <div class="multiplier-box">
            <div class="multiplier" id="multiplier">1.00x</div>
        </div>

        <button id="actionBtn" class="btn btn-start" onclick="startCountdown()">Place Bet / Ready</button>
        <div class="message" id="message">Observe the landscape & place your continuity bet.</div>
    </div>

    <script>
        let balance = 100;
        let currentMultiplier = 1.00;
        let gameInterval = null;
        let crashPoint = 1.00;
        let isPlaying = false;
        let isCountingDown = false;
        let tickCount = 0;
        let history = [];
        let countdownTimer = null;

        const balanceEl = document.getElementById('balance');
        const multiplierEl = document.getElementById('multiplier');
        const actionBtn = document.getElementById('actionBtn');
        const messageEl = document.getElementById('message');
        const bucketAssembly = document.getElementById('bucketAssembly');
        const ropeEl = document.getElementById('rope');
        const wellContainer = document.getElementById('wellContainer');
        const historyBoard = document.getElementById('historyBoard');

        function startCountdown() {
            if (isCountingDown || isPlaying) return;
            if (balance < 10) {
                messageEl.innerText = "Not enough balance!";
                messageEl.style.color = "#ef4444";
                return;
            }

            balance -= 10;
            balanceEl.innerText = balance;

            isCountingDown = true;
            actionBtn.innerText = "Skip / Starting...";
            
            let countdown = 7; // Compte à rebours fixé à 7s max
            messageEl.innerText = `Continuity window: observe trends (${countdown}s)`;
            messageEl.style.color = "#38bdf8";

            // Permet de cliquer à nouveau pour passer le compte à rebours immédiatement
            actionBtn.setAttribute("onclick", "skipCountdown()");

            countdownTimer = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    messageEl.innerText = `Continuity window: observe trends (${countdown}s)`;
                } else {
                    clearInterval(countdownTimer);
                    triggerLaunch();
                }
            }, 1000);
        }

        function skipCountdown() {
            if (!isCountingDown) return;
            clearInterval(countdownTimer);
            triggerLaunch();
        }

        function triggerLaunch() {
            isCountingDown = false;
            isPlaying = true;
            currentMultiplier = 1.00;
            tickCount = 0;
            multiplierEl.innerText = "1.00x";
            multiplierEl.style.color = "#ffffff";
            messageEl.innerText = "Winch engaged: bucket descending into stone well...";
            messageEl.style.color = "#38bdf8";

            actionBtn.innerText = "Cash Out";
            actionBtn.className = "btn btn-cashout";
            actionBtn.setAttribute("onclick", "cashOut()");

            let rand = Math.random();
            if (rand < 0.18) {
                crashPoint = parseFloat((Math.random() * 0.4 + 1.02).toFixed(2)); 
            } else {
                crashPoint = parseFloat((Math.random() * 7.5 + 1.25).toFixed(2)); 
            }

            const maxTravel = wellContainer.clientHeight - 65;

            gameInterval = setInterval(() => {
                tickCount++;
                currentMultiplier += 0.013;
                let displayVal = currentMultiplier.toFixed(2);
                multiplierEl.innerText = displayVal + "x";

                let progressFactor = Math.min((currentMultiplier - 1) / 5.0, 1);
                
                let mechanicalJitter = Math.sin(tickCount * 0.9) * 1.5;
                let currentPos = 8 + (progressFactor * (maxTravel - 8)) + mechanicalJitter;
                
                bucketAssembly.style.transform = `translateX(-50%) translateY(${currentPos}px)`;
                ropeEl.style.height = (4 + (progressFactor * 32)) + 'px';

                if (currentMultiplier >= crashPoint) {
                    crashGame();
                }
            }, 90);
        }

        function cashOut() {
            if (!isPlaying) return;
            clearInterval(gameInterval);
            isPlaying = false;

            let winnings = Math.floor(10 * currentMultiplier);
            balance += winnings;
            balanceEl.innerText = balance;

            multiplierEl.style.color = "#4ade80";
            messageEl.innerText = `Cashed out successfully! Won $${winnings}`;
            messageEl.style.color = "#4ade80";

            addToHistory(currentMultiplier, true);
            resetButton();
        }

        function crashGame() {
            clearInterval(gameInterval);
            isPlaying = false;

            multiplierEl.style.color = "#f87171";
            multiplierEl.innerText = crashPoint.toFixed(2) + "x - CRASHED!";
            messageEl.innerText = "The rope jammed in the dark abyss!";
            messageEl.style.color = "#f87171";

            const maxTravel = wellContainer.clientHeight - 65;
            bucketAssembly.style.transform = `translateX(-50%) translateY(${maxTravel}px)`;

            addToHistory(crashPoint, false);
            resetButton();
        }

        function addToHistory(cote, success) {
            history.unshift({ val: cote.toFixed(2) + 'x', success: success });
            if (history.length > 5) history.pop();

            let html = '';
            history.forEach(item => {
                let cssClass = item.success ? 'high' : 'low';
                html += `<div class="history-tag ${cssClass}">${item.val}</div>`;
            });
            historyBoard.innerHTML = html;
        }

        function resetButton() {
            actionBtn.innerText = "Place Bet / Ready";
            actionBtn.className = "btn btn-start";
            actionBtn.setAttribute("onclick", "startCountdown()");
        }
    </script>
</body>
</html>
