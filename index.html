<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash or Crash - Deluxe Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            /* Environnement extérieur verdoyant et nature */
            background: linear-gradient(180deg, #134e2c 0%, #1e6f3d 40%, #0f172a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow: hidden;
        }
        .game-container {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(74, 222, 128, 0.3);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            text-align: center;
        }
        h1 {
            font-size: 1.7rem;
            margin-bottom: 4px;
            background: linear-gradient(45deg, #4ade80, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(74, 222, 128, 0.2);
        }
        .balance {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        /* Décor du Puits en pierres grises avec ombrages profonds */
        .well-container {
            position: relative;
            width: 100%;
            height: 230px;
            margin: 0 auto 15px auto;
            background: 
                radial-gradient(circle at center, #262c36 0%, #11151c 100%),
                repeating-linear-gradient(0deg, transparent, transparent 15px, rgba(0,0,0,0.4) 15px, rgba(0,0,0,0.4) 18px),
                repeating-linear-gradient(90deg, transparent, transparent 30px, rgba(255,255,255,0.03) 30px, rgba(255,255,255,0.03) 32px);
            border: 4px solid #334155;
            border-top: 8px solid #475569;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: inset 0 20px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
        }

        /* Effet de texture de briques/pierres sur les côtés du puits */
        .well-container::before {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 25px 0 30px rgba(0,0,0,0.7), inset -25px 0 30px rgba(0,0,0,0.7);
            pointer-events: none;
            z-index: 2;
        }

        .rope {
            position: absolute;
            top: 0;
            width: 4px;
            background: #d4d4d8;
            box-shadow: 1px 0 3px rgba(0,0,0,0.8);
            height: 20px;
            z-index: 1;
            transition: height 0.1s linear;
        }

        .bucket {
            position: absolute;
            top: 20px;
            width: 64px;
            height: 56px;
            background: linear-gradient(135deg, #64748b, #334155);
            border: 2px solid #94a3b8;
            border-radius: 0 0 14px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            z-index: 3;
            transition: transform 0.1s linear;
            box-shadow: 0 10px 20px rgba(0,0,0,0.7), inset 0 4px 8px rgba(255,255,255,0.2);
        }
        
        .bucket::before {
            content: '';
            position: absolute;
            top: -12px;
            width: 52px;
            height: 12px;
            border: 3px solid #cbd5e1;
            border-top: none;
            border-radius: 0 0 10px 10px;
        }

        .multiplier-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .multiplier {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-start {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        }
        .btn-start:active {
            transform: scale(0.98);
        }
        .btn-cashout {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0f172a;
            box-shadow: 0 6px 20px rgba(234, 179, 8, 0.4);
            display: none;
        }
        .message {
            margin-top: 12px;
            font-size: 0.95rem;
            min-height: 22px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Cash or Crash</h1>
        <div class="balance">Balance: $<span id="balance">100</span></div>

        <!-- Puits grand format avec pierres grises et ombrages -->
        <div class="well-container" id="wellContainer">
            <div class="rope" id="rope" style="height: 20px;"></div>
            <div class="bucket" id="bucket" style="transform: translateY(20px);">🪣</div>
        </div>

        <div class="multiplier-box">
            <div class="multiplier" id="multiplier">1.00x</div>
        </div>

        <button id="actionBtn" class="btn btn-start" onclick="startGame()">Start Game</button>
        <div class="message" id="message">Place your bet and start!</div>
    </div>

    <script>
        let balance = 100;
        let currentMultiplier = 1.00;
        let gameInterval = null;
        let crashPoint = 1.00;
        let isPlaying = false;

        const balanceEl = document.getElementById('balance');
        const multiplierEl = document.getElementById('multiplier');
        const actionBtn = document.getElementById('actionBtn');
        const messageEl = document.getElementById('message');
        const bucketEl = document.getElementById('bucket');
        const ropeEl = document.getElementById('rope');
        const wellContainer = document.getElementById('wellContainer');

        function startGame() {
            if (balance < 10) {
                messageEl.innerText = "Not enough balance!";
                messageEl.style.color = "#ef4444";
                return;
            }

            balance -= 10;
            balanceEl.innerText = balance;
            
            isPlaying = true;
            currentMultiplier = 1.00;
            multiplierEl.innerText = "1.00x";
            multiplierEl.style.color = "#ffffff";
            messageEl.innerText = "The bucket descends into the dark depths...";
            messageEl.style.color = "#38bdf8";

            actionBtn.innerText = "Cash Out";
            actionBtn.className = "btn btn-cashout";
            actionBtn.setAttribute("onclick", "cashOut()");

            // Aléatoire du crash entre 1.15x et 6.00x
            crashPoint = parseFloat((Math.random() * 4.85 + 1.15).toFixed(2));

            const maxWellHeight = wellContainer.clientHeight - 70;

            gameInterval = setInterval(() => {
                currentMultiplier += 0.025;
                let displayVal = currentMultiplier.toFixed(2);
                multiplierEl.innerText = displayVal + "x";

                // Descente progressive du seau dans le puits en pierre
                let depthProgress = Math.min((currentMultiplier - 1) * 35, maxWellHeight);
                ropeEl.style.height = (20 + depthProgress) + 'px';
                bucketEl.style.transform = `translateY(${20 + depthProgress}px)`;

                if (currentMultiplier >= crashPoint) {
                    crashGame();
                }
            }, 90);
        }

        function cashOut() {
            if (!isPlaying) return;
            clearInterval(gameInterval);
            isPlaying = false;

            let winnings = Math.floor(10 * currentMultiplier);
            balance += winnings;
            balanceEl.innerText = balance;

            multiplierEl.style.color = "#4ade80";
            messageEl.innerText = `Cashed out successfully! Won $${winnings}`;
            messageEl.style.color = "#4ade80";

            resetButton();
        }

        function crashGame() {
            clearInterval(gameInterval);
            isPlaying = false;

            multiplierEl.style.color = "#ef4444";
            multiplierEl.innerText = crashPoint.toFixed(2) + "x - CRASHED!";
            messageEl.innerText = "The rope snapped in the abyss! Lost bet.";
            messageEl.style.color = "#ef4444";

            // Effet de chute brutale au fond du puits
            const maxWellHeight = wellContainer.clientHeight - 70;
            ropeEl.style.height = maxWellHeight + 'px';
            bucketEl.style.transform = `translateY(${maxWellHeight}px)`;

            resetButton();
        }

        function resetButton() {
            actionBtn.innerText = "Play Again";
            actionBtn.className = "btn btn-start";
            actionBtn.setAttribute("onclick", "startGame()");
        }
    </script>
</body>
</html>
