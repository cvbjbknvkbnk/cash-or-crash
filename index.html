<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash or Crash - Vraies Pierres CSS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(180deg, #10b981 0%, #047857 20%, #0f172a 50%, #020617 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .game-container {
            background: rgba(15, 23, 42, 0.96);
            border: 3px solid #22c55e;
            border-radius: 20px;
            padding: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #4ade80;
        }
        .balance-panel {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #94a3b8;
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .balance-panel span {
            color: #4ade80;
            font-weight: bold;
        }
        .history-board {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 10px;
            overflow-x: auto;
            min-height: 26px;
        }
        .history-tag {
            background: #334155;
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .history-tag.high { color: #4ade80; border: 1px solid #22c55e; }
        .history-tag.low { color: #f87171; border: 1px solid #ef4444; }

        /* VRAI MUR DE PIERRES EN CSS PUR (Briques texturées) */
        .well-container {
            position: relative;
            width: 100%;
            height: 210px;
            background-color: #263345;
            /* Motif de briques géométriques nettes et garanties */
            background-image: 
                linear-gradient(90deg, #182232 50%, transparent 50%),
                linear-gradient(0deg, #182232 50%, transparent 50%);
            background-size: 50px 25px;
            border: 6px solid #64748b;
            border-top: 10px solid #94a3b8;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: inset 0 25px 40px rgba(0,0,0,0.95);
        }

        .bucket-assembly {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            transition: transform 0.08s linear;
        }
        .rope {
            width: 4px;
            background: #f8fafc;
            height: 10px;
            box-shadow: 2px 0 4px rgba(0,0,0,0.8);
        }
        .bucket {
            width: 46px;
            height: 40px;
            background: linear-gradient(135deg, #64748b, #334155);
            border: 2px solid #cbd5e1;
            border-radius: 0 0 10px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 8px 16px rgba(0,0,0,0.8);
        }
        .multiplier-box {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            padding: 6px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-start {
            background: #22c55e;
            color: white;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }
        .btn-cashout {
            background: #eab308;
            color: #0f172a;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4);
            display: none;
        }
        .message {
            margin-top: 8px;
            font-size: 0.85rem;
            min-height: 20px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Cash or Crash</h1>
        
        <div class="balance-panel">
            <div>Balance: $<span id="balance">100</span></div>
            <div>Mise: <b>$10</b></div>
        </div>

        <div class="history-board" id="historyBoard">
            <span class="history-tag">Aucune cote</span>
        </div>

        <div class="well-container" id="wellContainer">
            <div class="bucket-assembly" id="bucketAssembly">
                <div class="rope" id="rope"></div>
                <div class="bucket">🪣</div>
            </div>
        </div>

        <div class="multiplier-box" id="multiplier">1.00x</div>

        <button id="actionBtn" class="btn btn-start" onclick="startCountdown()">Prêt / Lancer (7s)</button>
        <div class="message" id="message">Phase d'observation (7 secondes max)</div>
    </div>

    <script>
        let balance = 100;
        let currentMultiplier = 1.00;
        let gameInterval = null;
        let crashPoint = 1.00;
        let isPlaying = false;
        let isCountingDown = false;
        let history = [];
        let countdownTimer = null;

        const balanceEl = document.getElementById('balance');
        const multiplierEl = document.getElementById('multiplier');
        const actionBtn = document.getElementById('actionBtn');
        const messageEl = document.getElementById('message');
        const bucketAssembly = document.getElementById('bucketAssembly');
        const ropeEl = document.getElementById('rope');
        const wellContainer = document.getElementById('wellContainer');
        const historyBoard = document.getElementById('historyBoard');

        function startCountdown() {
            if (isCountingDown || isPlaying) return;
            if (balance < 10) {
                messageEl.innerText = "Solde insuffisant !";
                return;
            }

            balance -= 10;
            balanceEl.innerText = balance;

            isCountingDown = true;
            actionBtn.innerText = "Passer (Lancer direct)";
            
            let countdown = 7;
            messageEl.innerText = `Observation & Pari de continuité (${countdown}s)`;

            actionBtn.setAttribute("onclick", "skipCountdown()");

            countdownTimer = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    messageEl.innerText = `Observation & Pari de continuité (${countdown}s)`;
                } else {
                    clearInterval(countdownTimer);
                    triggerLaunch();
                }
            }, 1000);
        }

        function skipCountdown() {
            if (!isCountingDown) return;
            clearInterval(countdownTimer);
            triggerLaunch();
        }

        function triggerLaunch() {
            isCountingDown = false;
            isPlaying = true;
            currentMultiplier = 1.00;
            multiplierEl.innerText = "1.00x";
            multiplierEl.style.color = "#ffffff";
            messageEl.innerText = "Le seau descend dans le puits de pierre...";

            actionBtn.innerText = "Cash Out";
            actionBtn.className = "btn btn-cashout";
            actionBtn.setAttribute("onclick", "cashOut()");

            crashPoint = parseFloat((Math.random() * 5.0 + 1.2).toFixed(2));
            const maxTravel = wellContainer.clientHeight - 55;
            let tick = 0;

            gameInterval = setInterval(() => {
                tick++;
                currentMultiplier += 0.015;
                multiplierEl.innerText = currentMultiplier.toFixed(2) + "x";

                let progress = Math.min((currentMultiplier - 1) / 4.0, 1);
                let currentPos = 10 + (progress * (maxTravel - 10));
                
                bucketAssembly.style.transform = `translateX(-50%) translateY(${currentPos}px)`;
                ropeEl.style.height = (10 + (progress * 35)) + 'px';

                if (currentMultiplier >= crashPoint) {
                    crashGame();
                }
            }, 90);
        }

        function cashOut() {
            if (!isPlaying) return;
            clearInterval(gameInterval);
            isPlaying = false;

            let winnings = Math.floor(10 * currentMultiplier);
            balance += winnings;
            balanceEl.innerText = balance;

            multiplierEl.style.color = "#4ade80";
            messageEl.innerText = `Gagné ! +$${winnings}`;

            addToHistory(currentMultiplier, true);
            resetButton();
        }

        function crashGame() {
            clearInterval(gameInterval);
            isPlaying = false;

            multiplierEl.style.color = "#f87171";
            multiplierEl.innerText = crashPoint.toFixed(2) + "x - CRASH !";
            messageEl.innerText = "Le seau s'est bloqué au fond !";

            const maxTravel = wellContainer.clientHeight - 55;
            bucketAssembly.style.transform = `translateX(-50%) translateY(${maxTravel}px)`;

            addToHistory(crashPoint, false);
            resetButton();
        }

        function addToHistory(cote, success) {
            history.unshift({ val: cote.toFixed(2) + 'x', success: success });
            if (history.length > 5) history.pop();

            let html = '';
            history.forEach(item => {
                let cssClass = item.success ? 'high' : 'low';
                html += `<div class="history-tag ${cssClass}">${item.val}</div>`;
            });
            historyBoard.innerHTML = html;
        }

        function resetButton() {
            actionBtn.innerText = "Prêt / Lancer (7s)";
            actionBtn.className = "btn btn-start";
            actionBtn.setAttribute("onclick", "startCountdown()");
        }
    </script>
</body>
</html>
