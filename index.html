<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash or Crash - Design Neutre & Moderne</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #090d16;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .game-container {
            background: #111827;
            border: 2px solid #374151;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #10b981;
        }
        .balance-panel {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #9ca3af;
            background: #1f2937;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .balance-panel span {
            color: #34d399;
            font-weight: bold;
        }
        .history-board {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 12px;
            overflow-x: auto;
            min-height: 28px;
        }
        .history-tag {
            background: #1f2937;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .history-tag.high { color: #34d399; border: 1px solid #059669; }
        .history-tag.low { color: #f87171; border: 1px solid #dc2626; }

        /* ZONE GRAPHIQUE ABSTRAITE ET ÉPURÉE */
        .visual-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: #1f2937;
            border: 2px solid #4b5563;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tracker-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(0deg, #059669, #34d399);
            transition: height 0.08s linear;
        }

        .abstract-indicator {
            position: relative;
            z-index: 2;
            font-size: 2rem;
            background: rgba(17, 24, 39, 0.8);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #4b5563;
        }

        .multiplier-box {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 12px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-start {
            background: #059669;
            color: white;
        }
        .btn-cashout {
            background: #d97706;
            color: #ffffff;
            display: none;
        }
        .message {
            margin-top: 10px;
            font-size: 0.85rem;
            min-height: 20px;
            color: #93c5fd;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Cash or Crash</h1>
        
        <div class="balance-panel">
            <div>Balance: $<span id="balance">100</span></div>
            <div>Mise: <b>$10</b></div>
        </div>

        <div class="history-board" id="historyBoard">
            <span class="history-tag">Aucune cote</span>
        </div>

        <div class="visual-container" id="visualContainer">
            <div class="tracker-bar" id="trackerBar"></div>
            <div class="abstract-indicator" id="abstractIndicator">⚡</div>
        </div>

        <div class="multiplier-box" id="multiplier">1.00x</div>

        <button id="actionBtn" class="btn btn-start" onclick="startCountdown()">Prêt / Lancer (7s)</button>
        <div class="message" id="message">Phase d'observation (7 secondes max)</div>
    </div>

    <script>
        let balance = 100;
        let currentMultiplier = 1.00;
        let gameInterval = null;
        let crashPoint = 1.00;
        let isPlaying = false;
        let isCountingDown = false;
        let history = [];
        let countdownTimer = null;

        const balanceEl = document.getElementById('balance');
        const multiplierEl = document.getElementById('multiplier');
        const actionBtn = document.getElementById('actionBtn');
        const messageEl = document.getElementById('message');
        const trackerBar = document.getElementById('trackerBar');
        const historyBoard = document.getElementById('historyBoard');

        function startCountdown() {
            if (isCountingDown || isPlaying) return;
            if (balance < 10) {
                messageEl.innerText = "Solde insuffisant !";
                return;
            }

            balance -= 10;
            balanceEl.innerText = balance;

            isCountingDown = true;
            actionBtn.innerText = "Passer (Lancer direct)";
            
            let countdown = 7;
            messageEl.innerText = `Observation (${countdown}s)`;

            actionBtn.setAttribute("onclick", "skipCountdown()");

            countdownTimer = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    messageEl.innerText = `Observation (${countdown}s)`;
                } else {
                    clearInterval(countdownTimer);
                    triggerLaunch();
                }
            }, 1000);
        }

        function skipCountdown() {
            if (!isCountingDown) return;
            clearInterval(countdownTimer);
            triggerLaunch();
        }

        function triggerLaunch() {
            isCountingDown = false;
            isPlaying = true;
            currentMultiplier = 1.00;
            multiplierEl.innerText = "1.00x";
            multiplierEl.style.color = "#ffffff";
            messageEl.innerText = "Progression en cours...";

            actionBtn.innerText = "Cash Out";
            actionBtn.className = "btn btn-cashout";
            actionBtn.setAttribute("onclick", "cashOut()");

            crashPoint = parseFloat((Math.random() * 5.0 + 1.2).toFixed(2));
            let tick = 0;

            gameInterval = setInterval(() => {
                tick++;
                currentMultiplier += 0.015;
                multiplierEl.innerText = currentMultiplier.toFixed(2) + "x";

                let progress = Math.min((currentMultiplier - 1) / 4.0, 1);
                trackerBar.style.height = (progress * 100) + '%';

                if (currentMultiplier >= crashPoint) {
                    crashGame();
                }
            }, 90);
        }

        function cashOut() {
            if (!isPlaying) return;
            clearInterval(gameInterval);
            isPlaying = false;

            let winnings = Math.floor(10 * currentMultiplier);
            balance += winnings;
            balanceEl.innerText = balance;

            multiplierEl.style.color = "#34d399";
            messageEl.innerText = `Gagné ! +$${winnings}`;

            addToHistory(currentMultiplier, true);
            resetButton();
        }

        function crashGame() {
            clearInterval(gameInterval);
            isPlaying = false;

            multiplierEl.style.color = "#f87171";
            multiplierEl.innerText = crashPoint.toFixed(2) + "x - CRASH !";
            messageEl.innerText = "Arrêt brutal de la progression.";

            trackerBar.style.background = "#dc2626";

            addToHistory(crashPoint, false);
            resetButton();
        }

        function addToHistory(cote, success) {
            history.unshift({ val: cote.toFixed(2) + 'x', success: success });
            if (history.length > 5) history.pop();

            let html = '';
            history.forEach(item => {
                let cssClass = item.success ? 'high' : 'low';
                html += `<div class="history-tag ${cssClass}">${item.val}</div>`;
            });
            historyBoard.innerHTML = html;
        }

        function resetButton() {
            actionBtn.innerText = "Prêt / Lancer (7s)";
            actionBtn.className = "btn btn-start";
            actionBtn.setAttribute("onclick", "startCountdown()");
            trackerBar.style.height = "0%";
            trackerBar.style.background = "linear-gradient(0deg, #059669, #34d399)";
        }
    </script>
</body>
</html>
